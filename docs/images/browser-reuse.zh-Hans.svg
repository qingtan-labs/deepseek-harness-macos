<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 浏览器标签复用效果图</title>
  <desc id="desc">不含隐私数据的浏览器效果图，展示聚焦已有本地 Harness 标签而不是创建重复标签。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#172033" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="80" y="88" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">点击一次，不再重复打开标签。</text>
  <text x="80" y="130" fill="#667085" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">浏览器允许检测时，Harness 会聚焦已有本地页面。</text>
  <g filter="url(#shadow)">
    <rect x="80" y="178" width="1040" height="500" rx="22" fill="#fff" stroke="#cdd6e5"/>
  </g>
  <path d="M80 200a22 22 0 0 1 22-22h996a22 22 0 0 1 22 22v98H80z" fill="#e8edf5"/>
  <circle cx="110" cy="205" r="7" fill="#ff605c"/><circle cx="134" cy="205" r="7" fill="#ffbd44"/><circle cx="158" cy="205" r="7" fill="#00ca4e"/>
  <rect x="202" y="194" width="292" height="56" rx="12" fill="#fff"/>
  <circle cx="228" cy="222" r="11" fill="#111827"/><text x="249" y="228" fill="#222b3a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">DeepSeek Harness</text>
  <rect x="110" y="256" width="970" height="42" rx="12" fill="#fff"/>
  <circle cx="136" cy="277" r="8" fill="#21a366"/><text x="156" y="283" fill="#3b4555" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">127.0.0.1:3080</text>
  <rect x="80" y="298" width="218" height="380" fill="#111827"/>
  <text x="112" y="344" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650">DeepSeek Harness</text>
  <rect x="104" y="372" width="170" height="42" rx="10" fill="#293244"/><text x="126" y="398" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">工作区</text>
  <text x="126" y="452" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">会话</text>
  <text x="126" y="495" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">设置</text>
  <text x="126" y="538" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">诊断</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="346" y="350" fill="#111827" font-size="28" font-weight="700">随时可以开始</text>
    <text x="346" y="383" fill="#667085" font-size="17">本地 Harness 服务健康可用。</text>
    <rect x="346" y="424" width="316" height="126" rx="16" fill="#f7f9fc" stroke="#e0e6ef"/>
    <text x="372" y="460" fill="#344054" font-size="15" font-weight="650">本地服务</text>
    <text x="372" y="495" fill="#111827" font-size="20">已连接 3080 端口</text>
    <text x="372" y="524" fill="#21a366" font-size="15">● 健康</text>
    <rect x="688" y="424" width="316" height="126" rx="16" fill="#f7f9fc" stroke="#e0e6ef"/>
    <text x="714" y="460" fill="#344054" font-size="15" font-weight="650">默认打开方式</text>
    <text x="714" y="495" fill="#111827" font-size="20">默认浏览器</text>
    <text x="714" y="524" fill="#667085" font-size="15">已保存，可随时修改</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="703" y="566" width="354" height="70" rx="18" fill="#0f9f68"/>
  </g>
  <circle cx="738" cy="601" r="13" fill="#fff" opacity=".95"/><path d="m732 601 4 4 8-9" fill="none" stroke="#0f9f68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="764" y="596" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="650">已聚焦已有标签</text>
  <text x="764" y="618" fill="#d9f7eb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">没有创建重复页面</text>
  <text x="80" y="720" fill="#7b8495" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">界面预览 · 仅使用演示内容 · 无用户数据</text>
</svg>
