<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness in-app window preview</title>
  <desc id="desc">A privacy-safe interface preview showing the native in-app window, local connection state, and close versus quit behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f2ff"/><stop offset="1" stop-color="#eef6f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#172033" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="80" y="88" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">A focused in-app workspace.</text>
  <text x="80" y="130" fill="#667085" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Close the window without quitting the menu bar controller or stopping Harness.</text>
  <g filter="url(#shadow)">
    <rect x="80" y="178" width="1040" height="500" rx="22" fill="#fff" stroke="#cdd6e5"/>
  </g>
  <path d="M80 200a22 22 0 0 1 22-22h996a22 22 0 0 1 22 22v46H80z" fill="#f0f2f6"/>
  <circle cx="110" cy="212" r="7" fill="#ff605c"/><circle cx="134" cy="212" r="7" fill="#ffbd44"/><circle cx="158" cy="212" r="7" fill="#00ca4e"/>
  <text x="600" y="218" text-anchor="middle" fill="#263142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650">DeepSeek Harness</text>
  <rect x="80" y="246" width="1040" height="52" fill="#f9fafb"/>
  <circle cx="110" cy="272" r="7" fill="#20a66a"/><text x="129" y="278" fill="#344054" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Connected · 127.0.0.1:3080</text>
  <rect x="984" y="256" width="112" height="32" rx="9" fill="#fff" stroke="#d5dce7"/><text x="1040" y="277" text-anchor="middle" fill="#344054" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Reload</text>
  <rect x="80" y="298" width="205" height="380" fill="#101827"/>
  <text x="108" y="342" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650">Harness</text>
  <rect x="102" y="368" width="160" height="42" rx="10" fill="#293244"/><text x="122" y="394" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">New session</text>
  <text x="122" y="450" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Recent</text>
  <rect x="108" y="474" width="140" height="11" rx="6" fill="#3b4558"/><rect x="108" y="498" width="112" height="11" rx="6" fill="#3b4558"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="335" y="360" fill="#111827" font-size="28" font-weight="700">Welcome to DeepSeek Harness</text>
    <text x="335" y="394" fill="#667085" font-size="17">Start locally, stay in one window, and return from the whale.</text>
    <rect x="335" y="434" width="706" height="104" rx="16" fill="#f7f9fc" stroke="#e0e6ef"/>
    <circle cx="374" cy="472" r="16" fill="#635bff" opacity=".15"/><circle cx="374" cy="472" r="7" fill="#635bff"/>
    <text x="407" y="467" fill="#111827" font-size="18" font-weight="650">Local session ready</text>
    <text x="407" y="496" fill="#667085" font-size="15">Your actual Harness content stays in the local web session.</text>
    <rect x="335" y="562" width="336" height="72" rx="14" fill="#eef8f3"/>
    <text x="359" y="590" fill="#187a52" font-size="15" font-weight="650">Close window</text>
    <text x="359" y="614" fill="#4a6f60" font-size="14">Whale and service stay available</text>
    <rect x="692" y="562" width="349" height="72" rx="14" fill="#fff5eb"/>
    <text x="716" y="590" fill="#a65b17" font-size="15" font-weight="650">Quit from menu</text>
    <text x="716" y="614" fill="#7e654e" font-size="14">Explicitly exits the controller</text>
  </g>
  <text x="80" y="720" fill="#7b8495" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Interface preview · Demonstration content only · No user data</text>
</svg>

