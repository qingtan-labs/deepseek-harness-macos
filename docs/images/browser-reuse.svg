  <rect x="80" y="238" width="1040" height="60" fill="#f4f6f9"/>
  <line x1="80" x2="1120" y1="238" y2="238" stroke="#d6dde8"/>
  <line x1="80" x2="1120" y1="298" y2="298" stroke="#d6dde8"/>
  <circle cx="110" cy="205" r="7" fill="#ff605c"/><circle cx="134" cy="205" r="7" fill="#ffbd44"/><circle cx="158" cy="205" r="7" fill="#00ca4e"/>
  <rect x="196" y="188" width="284" height="46" rx="12" fill="#fff" stroke="#d9e0ea"/>
  <circle cx="222" cy="211" r="10" fill="#111827"/><text x="244" y="217" fill="#222b3a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">DeepSeek Harness</text>
  <path d="M500 204v14M493 211h14" stroke="#697386" stroke-width="2" stroke-linecap="round"/>
  <path d="m118 261-8 7 8 7M150 261l8 7-8 7" fill="none" stroke="#667085" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M181 260a9 9 0 1 0 2 11M181 260v7h-7" fill="none" stroke="#667085" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="208" y="247" width="806" height="42" rx="12" fill="#fff" stroke="#d4dce8"/>
  <rect x="229" y="264" width="12" height="10" rx="2" fill="#21a366"/><path d="M232 264v-4a3 3 0 0 1 6 0v4" fill="none" stroke="#21a366" stroke-width="2"/>
  <text x="253" y="274" fill="#3b4555" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">http://127.0.0.1:3080</text>
  <circle cx="1045" cy="268" r="10" fill="none" stroke="#667085" stroke-width="2"/><circle cx="1045" cy="265" r="3" fill="#667085"/><path d="M1039 274c2-5 10-5 12 0" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1080" cy="261" r="2.2" fill="#667085"/><circle cx="1080" cy="268" r="2.2" fill="#667085"/><circle cx="1080" cy="275" r="2.2" fill="#667085"/>
  <rect x="80" y="298" width="218" height="380" fill="#111827"/>
  <text x="112" y="344" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650">DeepSeek Harness</text>
  <rect x="104" y="372" width="170" height="42" rx="10" fill="#293244"/><text x="126" y="398" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Workspace</text>
  <text x="126" y="452" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Sessions</text>
  <text x="126" y="495" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Settings</text>
  <text x="126" y="538" fill="#aeb8c8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Diagnostics</text>
